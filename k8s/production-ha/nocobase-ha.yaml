apiVersion: v1
kind: Namespace
metadata:
  name: nocobase
---
# ==========================================
# Orchestrator RBAC
# ==========================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nocobase-orchestrator
  namespace: nocobase
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nocobase-orchestrator
  namespace: nocobase
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nocobase-orchestrator
  namespace: nocobase
subjects:
  - kind: ServiceAccount
    name: nocobase-orchestrator
    namespace: nocobase
roleRef:
  kind: Role
  name: nocobase-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
# ==========================================
# 1. ConfigMap và Secret
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nocobase-config
  namespace: nocobase
data:
  APP_ENV: "production"
  DB_DIALECT: "postgres"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "nocobase"
  DB_USER: "nocobase"
  DB_LOGGING: "off"
  CACHE_DEFAULT_STORE: "redis"
  CACHE_REDIS_URL: "redis://redis:6379/0"
  REDIS_URL: "redis://redis:6379/1"
  PUBSUB_ADAPTER: "redis"
  PUBSUB_ADAPTER_REDIS_URL: "redis://redis:6379/2"
  QUEUE_ADAPTER: "redis"
  QUEUE_ADAPTER_REDIS_URL: "redis://redis:6379/3"
  LOCK_ADAPTER_DEFAULT: "redis"
  LOCK_ADAPTER_REDIS_URL: "redis://redis:6379/4"
  ORCHESTRATOR_ADAPTER: "kubernetes"
  APPEND_PRESET_LOCAL_PLUGINS: "plugin-cluster-manager"
  LOGGER_LEVEL: "debug"
  LOGGER_TRANSPORT: "console,dailyRotateFile"
  TZ: "UTC"
  NOCOBASE_VERSION: "2.0.46-full"
  SKIP_SAME_VERSION_UPGRADE: "true"
  GIT_REPOS_BASE_PATH: "/app/nocobase/storage/git-repo"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  SFTP_HOST: "sftp"
  SFTP_PORT: "22"
  CARBONE_URL: "http://carbone:4000"
  NPM_REGISTRY_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/npm/"
  APT_MIRROR_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/debian/"
  PYPI_INDEX_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/pypi-simple/"
---
apiVersion: v1
kind: Secret
metadata:
  name: nocobase-secret
  namespace: nocobase
type: Opaque
stringData:
  APP_KEY: "change-this-secret-key"
  ENCRYPTION_FIELD_KEY: "change-this-encryption-key"
  DB_PASSWORD: "nocobase-db-password"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "password123"
  ELASTIC_PASSWORD: "elastic-password-change-me"
  SFTP_USER: "sftpuser"
  SFTP_PASSWORD: "sftp-password-change-me"
  CARBONE_EE_STUDIO_TOKEN: "change-this-carbone-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nocobase-scripts
  namespace: nocobase
data:
  hotfix-license.js: |
    const fs = require('fs');
    const path = require('path');
    function hotfixLicenseKit() {
      const targetPath = path.resolve(process.cwd(), 'node_modules/@nocobase/license-kit/index.js');
      if (!fs.existsSync(targetPath)) return;
      let content = fs.readFileSync(targetPath, 'utf8');
      if (content.includes('[Offline Bypass]')) return;
      const targetRegex = /if\s*\(!nativeBinding\)\s*\{\s*if\s*\(loadError\)\s*\{\s*throw\s*loadError\s*\}\s*throw\s*new\s*Error\(`Failed to load native binding`\)\s*\}/g;
      const replacementCode = `if (!nativeBinding) {
      console.warn('[Offline Bypass] @nocobase/license-kit native binding not found. Using mock implementation.');
      nativeBinding = {
        getEnvAsync: async () => ({ sys: 'mock', osVer: 'mock', db: { id: 'mock' } }),
        getInstanceIdWithPublicKeyAsync: async () => 'mock-id',
        getInstanceIdAsync: async () => 'mock-id',
        instanceIdDecrypt: () => 'mock',
        createKeyPair: () => ({ publicKey: 'mock', privateKey: 'mock' }),
        encryptWithPublicKey: () => 'mock',
        encrypt: () => 'mock',
        decryptWithPrivateKey: () => 'mock',
        createSignature: () => 'mock',
        verifySignature: () => true,
        keyEncrypt: () => 'mock',
        keyDecrypt: () => JSON.stringify({
          accessKeyId: 'mock-user',
          accessKeySecret: 'mock-pass',
          licenseKey: { domain: '*' },
          instanceData: { sys: 'mock', osVer: 'mock', db: { id: 'mock' } }
        }),
      };
    }`;
      if (!targetRegex.test(content)) return;
      content = content.replace(targetRegex, replacementCode);
      fs.writeFileSync(targetPath, content, 'utf8');
    }
    hotfixLicenseKit();

  upgrade-with-lock.js: |
    /**
     * Wraps `yarn nocobase upgrade` with a Postgres advisory lock so that
     * only ONE node in the cluster runs upgrade at a time.
     *
     * Behavior:
     *   1. Connect to Postgres using the same env vars NocoBase uses.
     *   2. Try pg_try_advisory_lock(777100).
     *   3. If acquired → run `yarn nocobase upgrade` → release lock.
     *   4. If NOT acquired → poll every 5s until the lock is free
     *      (meaning the other node finished), then skip upgrade.
     *
     * Advisory lock 777100 is session-scoped: auto-released if the
     * holder crashes or disconnects.
     */
    const { execSync } = require('child_process');
    const { Client } = require('pg');

    const LOCK_ID = 777100;
    const POLL_INTERVAL_MS = 5000;
    const MAX_WAIT_MS = 600000; // 10 minutes

    async function main() {
      const client = new Client({
        host:     process.env.DB_HOST,
        port:     parseInt(process.env.DB_PORT || '5432', 10),
        database: process.env.DB_DATABASE,
        user:     process.env.DB_USER,
        password: process.env.DB_PASSWORD,
      });

      await client.connect();
      console.log('[upgrade-lock] Connected to Postgres');

      try {
        // Try to acquire the advisory lock (non-blocking)
        const { rows } = await client.query(
          `SELECT pg_try_advisory_lock(${LOCK_ID}) AS locked`
        );
        const acquired = rows[0].locked === true;

        if (acquired) {
          console.log('[upgrade-lock] Lock acquired — this node will run upgrade');
          try {
            execSync('yarn nocobase upgrade', {
              cwd: process.cwd(),
              stdio: 'inherit',
              env: process.env,
            });
            console.log('[upgrade-lock] Upgrade completed successfully');
          } finally {
            await client.query(`SELECT pg_advisory_unlock(${LOCK_ID})`);
            console.log('[upgrade-lock] Lock released');
          }
        } else {
          console.log('[upgrade-lock] Another node is running upgrade — waiting...');
          let waited = 0;
          while (waited < MAX_WAIT_MS) {
            await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
            waited += POLL_INTERVAL_MS;
            const check = await client.query(
              `SELECT pg_try_advisory_lock(${LOCK_ID}) AS locked`
            );
            if (check.rows[0].locked === true) {
              // Lock is free now → the other node finished
              await client.query(`SELECT pg_advisory_unlock(${LOCK_ID})`);
              console.log(`[upgrade-lock] Other node finished after ${waited / 1000}s — skipping upgrade`);
              break;
            }
            console.log(`[upgrade-lock] Still waiting... (${waited / 1000}s)`);
          }
          if (waited >= MAX_WAIT_MS) {
            console.error('[upgrade-lock] Timed out waiting for upgrade lock!');
            process.exit(1);
          }
        }
      } finally {
        await client.end();
      }
    }

  LOGGER_TRANSPORT: "console,dailyRotateFile"
  TZ: "UTC"
  NOCOBASE_VERSION: "2.0.46-full"
  SKIP_SAME_VERSION_UPGRADE: "true"
  GIT_REPOS_BASE_PATH: "/app/nocobase/storage/git-repo"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  SFTP_HOST: "sftp"
  SFTP_PORT: "22"
  CARBONE_URL: "http://carbone:4000"
  NPM_REGISTRY_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/npm/"
  APT_MIRROR_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/ubuntu/"
  PYPI_INDEX_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/pypi-simple/"
  NPM_REGISTRY_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/npm/"
  APT_MIRROR_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/ubuntu/"
  PYPI_INDEX_URL: "http://nginx-cache-registry.nocobase.svc.cluster.local/pypi-simple/"
---
