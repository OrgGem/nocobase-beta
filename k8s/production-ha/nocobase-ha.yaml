# Nginx Cache Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cache-registry
  namespace: nocobase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-cache-registry
  template:
    metadata:
      labels:
        app: nginx-cache-registry
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache-data
              mountPath: /var/cache/nginx/packages
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-cache-config
        - name: nginx-cache-data
          persistentVolumeClaim:
            claimName: nginx-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-cache-registry
  namespace: nocobase
spec:
  selector:
    app: nginx-cache-registry
  ports:
    - port: 80

# ==========================================
# 4. NocoBase App Cluster
# ==========================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-primary
  namespace: nocobase
spec:
  # Increase this value for multi-app mode. Workers are created and scaled
  # from the Cluster Manager plugin, not from this bootstrap manifest.
  replicas: 1
  selector:
    matchLabels:
      app: app-primary
  template:
    metadata:
      labels:
        app: app-primary
        role: app
    spec:
      serviceAccountName: nocobase-orchestrator
      containers:
        - name: nocobase
          image: nocobase/nocobase:2.0.46-full
          command:
            - /bin/sh
            - -c
            - |
              export NOCOBASE_RUNNING_IN_DOCKER=true
              # NOTE: OS/pip/npm packages (including git) are managed by the
              # Cluster Manager plugin's PackageInstaller tab. There is no need
              # to pre-install them here; the plugin broadcasts installs to every
              # node via Redis PubSub on demand.
              if [ ! -d /app/nocobase ]; then mkdir /app/nocobase; fi
              if [ ! -f /app/nocobase/package.json ]; then
                echo "copying..."
                tar -zxf /app/nocobase.tar.gz --absolute-names -C /app/nocobase
                touch /app/nocobase/node_modules/@nocobase/app/dist/client/index.html
              fi
              echo "Applying license hotfix..."
              cd /app/nocobase && node /hotfix-license.js
              yarn nocobase postinstall
              yarn nocobase db:auth
              node /upgrade-with-lock.js
              exec yarn start
          ports:
            - containerPort: 13000
          envFrom:
            - configMapRef:
                name: nocobase-config
            - secretRef:
                name: nocobase-secret
          env:
            - name: APP_ROLE
              value: "app"
            - name: WORKER_MODE
              value: "!"
            - name: APP_PORT
              value: "13000"
            - name: SKILL_HUB_SANDBOX
              value: "false"
          volumeMounts:
            - name: app-storage
              mountPath: /app/nocobase/storage
            - name: script-volume
              mountPath: /hotfix-license.js
              subPath: hotfix-license.js
            - name: script-volume
              mountPath: /upgrade-with-lock.js
              subPath: upgrade-with-lock.js
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage
        - name: script-volume
          configMap:
            name: nocobase-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: app-primary
  namespace: nocobase
spec:
  selector:
    app: app-primary
  ports:
    - port: 13000

# ==========================================
# 5. Workers  (managed entirely by plugin-cluster-manager)
#
# ── Container lifecycle (Orchestrator tab) ──────────────────────────────────
# Worker Deployments are NOT created here. Open Cluster Manager → Orchestrator,
# create one or more worker stacks (image, replicas, envFrom, volumes, …) and
# scale them from the UI. The plugin uses the nocobase-orchestrator ServiceAccount
# and the RBAC defined above to create/patch/delete K8s Deployments at runtime.
#
# Default values pre-filled in the "New worker stack" form:
#   image:              nocobase/nocobase:2.0.46-full
#   deploymentName:     app-workers
#   serviceAccountName: nocobase-orchestrator
#   envFrom:            nocobase-config + nocobase-secret
#   volumes:            app-storage PVC + nocobase-scripts ConfigMap
#
# ── OS / Python / Node dependencies (PackageInstaller tab) ──────────────────
# System packages such as git, python3, pip modules, and npm globals are NOT
# pre-installed in this YAML. Use Cluster Manager → Package Installer to push
# apt/pip/npm installs to every node (app + worker) via Redis PubSub.
# Each node idempotently checks whether a package is already present before
# running the installer, so repeated dispatches are safe.
# ==========================================

# ==========================================
# 6. Ingress (Nginx Controller Proxy)
# ==========================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nocobase-ingress
  namespace: nocobase
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-primary
                port:
                  number: 13000
