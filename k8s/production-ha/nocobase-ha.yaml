# ==========================================
# Carbone.io — document template render engine
# Used by plugin-carbone-template-manager.
# Image: https://hub.docker.com/r/carbone/carbone-ee
# Free tier when no license is provided.
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbone
  namespace: nocobase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbone
  template:
    metadata:
      labels:
        app: carbone
    spec:
      containers:
        - name: carbone
          image: carbone/carbone-ee:latest
          ports:
            - containerPort: 4000
          env:
            - name: CARBONE_EE_PORT
              value: "4000"
            - name: CARBONE_EE_AUTHENTICATION
              value: "true"
            - name: CARBONE_EE_FACTORIES
              value: "1"
            - name: CARBONE_EE_STUDIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nocobase-secret
                  key: CARBONE_EE_STUDIO_TOKEN
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /status
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: carbone-templates
              mountPath: /app/template
            - name: carbone-renders
              mountPath: /app/render
      volumes:
        - name: carbone-templates
          persistentVolumeClaim:
            claimName: carbone-templates
        - name: carbone-renders
          persistentVolumeClaim:
            claimName: carbone-renders
---
apiVersion: v1
kind: Service
metadata:
  name: carbone
  namespace: nocobase
spec:
  selector:
    app: carbone
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30022

