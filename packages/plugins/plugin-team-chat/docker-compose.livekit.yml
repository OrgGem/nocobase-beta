# LiveKit SFU — Docker Compose Snippet
# Add this service to your existing NocoBase docker-compose.yml
#
# Required environment variables in NocoBase service:
#   - LIVEKIT_API_KEY=devkey
#   - LIVEKIT_API_SECRET=secret1234567890abcdefghijklmnopqrstuv
#   - LIVEKIT_URL=ws://livekit:7880  (internal) or wss://livekit.yourdomain.com (external)

version: '3.8'

services:
  # ===== Add this to your existing docker-compose.yml =====
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: livekit-sfu
    restart: unless-stopped
    ports:
      - "7880:7880"          # HTTP API + WebSocket signaling
      - "7881:7881/tcp"      # RTC TCP fallback
      - "50000-50200:50000-50200/udp"  # WebRTC media (narrowed range for docker)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml --node-ip=0.0.0.0
    networks:
      - nocobase
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== Add these env vars to your existing nocobase service =====
  # nocobase:
  #   environment:
  #     - LIVEKIT_API_KEY=devkey
  #     - LIVEKIT_API_SECRET=secret1234567890abcdefghijklmnopqrstuv
  #     - LIVEKIT_URL=ws://livekit:7880

networks:
  nocobase:
    external: true
