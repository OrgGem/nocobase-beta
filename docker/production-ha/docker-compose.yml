# ==============================================================================
# NocoBase Production Stack
# ==============================================================================
#
#   Client -> nginx (embedded config, no file mounts - Portainer compatible)
#             -> app-1:13000 (Node.js/Koa, WORKER_MODE=! : HTTP + WebSocket)
#
#   Background:
#             worker-1, worker-2 (WORKER_MODE=* : all background jobs)
#
#   Data:
#             postgres 16 (tuned)
#             redis 7 (cache + pub/sub + job queue)
#             qdrant (external RAG vector index)
#
#   Boot order:
#     1. postgres + redis start and become healthy
#     2. app-1 starts (runs migrations/install/upgrade)
#     3. app-1 becomes healthy (API responding on :13000)
#     4. nginx starts
#
#   Workers:
#     Workers are now managed dynamically by plugin-cluster-manager.
#     app-1 mounts /var/run/docker.sock to manage worker containers.
# ==============================================================================

x-nocobase-env: &nocobase-env
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  ENCRYPTION_FIELD_KEY: ${ENCRYPTION_FIELD_KEY:?Set ENCRYPTION_FIELD_KEY in .env}
  DB_DIALECT: postgres
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-nocobase}
  DB_USER: ${DB_USER:-nocobase}
  DB_PASSWORD: ${DB_PASSWORD:-nocobase}
  DB_LOGGING: 'off'
  # Redis
  CACHE_DEFAULT_STORE: redis
  CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
  # PubSub adapter (required for cluster sync across nodes)
  PUBSUB_ADAPTER: redis
  PUBSUB_ADAPTER_REDIS_URL: ${PUBSUB_ADAPTER_REDIS_URL:-redis://redis:6379/2}
  # Queue adapter (required for distributed job processing)
  QUEUE_ADAPTER: redis
  QUEUE_ADAPTER_REDIS_URL: ${QUEUE_ADAPTER_REDIS_URL:-redis://redis:6379/3}
  # Lock adapter (required for distributed locks)
  LOCK_ADAPTER_DEFAULT: redis
  LOCK_ADAPTER_REDIS_URL: ${LOCK_ADAPTER_REDIS_URL:-redis://redis:6379/4}
  # Orchestrator
  ORCHESTRATOR_ADAPTER: ${ORCHESTRATOR_ADAPTER:-docker}
  # Logging
  LOGGER_LEVEL: debug
  LOGGER_TRANSPORT: console,dailyRotateFile
  # Timezone
  TZ: ${TZ:-UTC}
  APPEND_PRESET_LOCAL_PLUGINS: ${APPEND_PRESET_LOCAL_PLUGINS:-}
  NPM_REGISTRY_URL: "http://nginx-cache-registry/npm/"
  APT_MIRROR_URL: "http://nginx-cache-registry/ubuntu/"
  PYPI_INDEX_URL: "http://nginx-cache-registry/pypi-simple/"
  # plugin-ai-browser — Playwright CDP Endpoint
  AI_BROWSER_CDP_URL: ${AI_BROWSER_CDP_URL:-ws://browser:3000}
  AI_BROWSER_LIVE_URL: ${AI_BROWSER_LIVE_URL:-/ai-browser-live/}
  AI_BROWSER_SESSIONS_URL: ${AI_BROWSER_SESSIONS_URL:-http://browser:3000/sessions}
  AI_BROWSER_SESSION_TTL_SECONDS: ${AI_BROWSER_SESSION_TTL_SECONDS:-1800}
  # plugin-knowledge-base - default Qdrant vector database/store seed
  KB_DEFAULT_VECTOR_DATABASE_PROVIDER: ${KB_DEFAULT_VECTOR_DATABASE_PROVIDER:-qdrant}
  KB_DEFAULT_QDRANT_URL: ${KB_DEFAULT_QDRANT_URL:-http://qdrant:6333}
  KB_DEFAULT_QDRANT_API_KEY: ${KB_DEFAULT_QDRANT_API_KEY:-}
  KB_DEFAULT_QDRANT_COLLECTION: ${KB_DEFAULT_QDRANT_COLLECTION:-nocobase_knowledge_base}
  KB_DEFAULT_VECTOR_DATABASE_NAME: ${KB_DEFAULT_VECTOR_DATABASE_NAME:-Default Qdrant}
  KB_DEFAULT_VECTOR_STORE_NAME: ${KB_DEFAULT_VECTOR_STORE_NAME:-Default Qdrant Vector Store}
  KB_DEFAULT_EMBEDDING_PROVIDER: ${KB_DEFAULT_EMBEDDING_PROVIDER:-llmService}
  KB_DEFAULT_EMBEDDING_LLM_SERVICE: ${KB_DEFAULT_EMBEDDING_LLM_SERVICE:-}
  KB_DEFAULT_EMBEDDING_MODEL: ${KB_DEFAULT_EMBEDDING_MODEL:-}
  KB_DEFAULT_LOCAL_EMBED_MODEL_ID: ${KB_DEFAULT_LOCAL_EMBED_MODEL_ID:-}
  KB_DEFAULT_LOCAL_EMBED_DTYPE: ${KB_DEFAULT_LOCAL_EMBED_DTYPE:-q8}

x-nocobase-base: &nocobase-base
  image: nocobase/nocobase:${NOCOBASE_VERSION:-2.0.46-full}
  restart: unless-stopped
  networks:
    - nocobase
  volumes:
    - app-storage:/app/nocobase/storage
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  init: true



networks:
  nocobase:
    driver: bridge

volumes:
  app-storage:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-cache:
    driver: local
  nginx-cache-data:
    driver: local
  minio-data:
    driver: local
  carbone-templates:
    driver: local
  carbone-renders:
    driver: local
  browser-data:
    driver: local
  qdrant-data:
    driver: local



services:
  # ============================================================================
  # NGINX — inline config (Portainer compatible, no file mounts)
  # Proxies directly to app-1:13000 (bypasses internal NocoBase nginx)
  # Static asset cache via proxy_cache (volume: nginx-cache)
  # All nginx $variables use $$ to escape Docker Compose interpolation
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - nginx-cache:/var/cache/nginx/static
    networks:
      - nocobase
    depends_on:
      app-1:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /etc/nginx/nginx.conf << 'NGINXEOF'
        worker_processes auto;
        worker_rlimit_nofile 65535;

        events {
            worker_connections 4096;
            multi_accept on;
        }

        http {
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout 65;
            types_hash_max_size 2048;
            client_max_body_size 0;
            server_tokens off;

            include /etc/nginx/mime.types;
            default_type application/octet-stream;

            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 4;
            gzip_min_length 256;
            gzip_types text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript
                       image/svg+xml;

            log_format main '$$remote_addr [$$time_local] "$$request" $$status $$body_bytes_sent '
                            'rt=$$request_time urt=$$upstream_response_time cache=$$upstream_cache_status';
            access_log /var/log/nginx/access.log main;
            error_log /var/log/nginx/error.log warn;

            proxy_cache_path /var/cache/nginx/static
                levels=1:2
                keys_zone=static:10m
                max_size=500m
                inactive=5m
                use_temp_path=off;

            upstream nocobase {
                server app-1:13000 max_fails=3 fail_timeout=30s;
                keepalive 32;
            }

            limit_req_zone $$binary_remote_addr zone=api_limit:10m rate=30r/s;
            limit_req_zone $$binary_remote_addr zone=general_limit:10m rate=100r/s;

            server {
                listen 80;
                http2 on;
                server_name _;

                proxy_cache_key "$$scheme$$host$$uri$$is_args$$args";

                location /nginx-health {
                    access_log off;
                    return 200 "ok\n";
                }

                location /api/ {
                    limit_req zone=api_limit burst=50 nodelay;
                    proxy_pass http://nocobase;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_connect_timeout 600;
                    proxy_send_timeout 600;
                    proxy_read_timeout 600;
                    proxy_cache off;
                }

                location /ws {
                    proxy_pass http://nocobase;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $$http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
                    proxy_buffering off;
                    proxy_cache off;
                }

                location /ai-browser-live/ {
                    proxy_pass http://browserless:3000/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $$http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
                    proxy_buffering off;
                    proxy_cache off;
                }

                location /devtools/ {
                    proxy_pass http://browserless:3000/devtools/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $$http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
                    proxy_buffering off;
                    proxy_cache off;
                }

                location /sessions {
                    proxy_pass http://browserless:3000/sessions;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $$http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_read_timeout 86400;
                    proxy_send_timeout 86400;
                    proxy_buffering off;
                    proxy_cache off;
                }

                location ~* ^/static/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                    proxy_pass http://nocobase;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_cache static;
                    proxy_cache_valid 200 5m;
                    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                    proxy_cache_lock on;
                    proxy_cache_lock_timeout 5s;
                    proxy_ignore_headers Cache-Control Expires Set-Cookie;
                    add_header X-Cache-Status $$upstream_cache_status;
                    add_header Cache-Control "public, max-age=300";
                }

                location ~* \.(woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                    proxy_pass http://nocobase;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                    proxy_cache static;
                    proxy_cache_valid 200 5m;
                    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                    proxy_cache_lock on;
                    add_header X-Cache-Status $$upstream_cache_status;
                    add_header Cache-Control "public, max-age=300";
                }

                location / {
                    limit_req zone=general_limit burst=200 nodelay;
                    proxy_pass http://nocobase;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $$host;
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
                }
            }
        }
        NGINXEOF
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # PRIMARY App - Runs migrations/install/upgrade via yarn nocobase upgrade
  # This is the ONLY node that touches the migrations table on boot
  # ============================================================================
  nginx-cache-registry:
    image: nginx:1.25-alpine
    container_name: nginx-cache-registry
    volumes:
      - ./nginx-cache-registry.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache-data:/var/cache/nginx/packages
    restart: always
    networks:
      - nocobase

  app-1:
    <<: *nocobase-base
    container_name: app-1
    command: 
      - /bin/sh
      - -c
      - |
        if [ ! -d /app/nocobase ]; then mkdir /app/nocobase; fi
        if [ ! -f /app/nocobase/package.json ]; then
          echo "Extracting NocoBase source..."
          tar -zxf /app/nocobase.tar.gz --absolute-names -C /app/nocobase
          touch /app/nocobase/node_modules/@nocobase/app/dist/client/index.html
        fi
        cd /app/nocobase
        echo "module.exports={getEnvAsync:async()=>({sys:'mock',osVer:'mock',db:{id:'mock'}}),getInstanceIdWithPublicKeyAsync:async()=>'mock',getInstanceIdAsync:async()=>'mock',instanceIdDecrypt:()=>'mock',createKeyPair:()=>({publicKey:'mock',privateKey:'mock'}),encryptWithPublicKey:()=>'mock',encrypt:()=>'mock',decryptWithPrivateKey:()=>'mock',createSignature:()=>'mock',verifySignature:()=>true,keyEncrypt:()=>'mock',keyDecrypt:()=>JSON.stringify({licenseKey:{domain:'*'}})}" > node_modules/@nocobase/license-kit/index.js
        exec yarn start
    environment:
      <<: *nocobase-env
      APP_ROLE: 'app'
      WORKER_MODE: '!'
      APP_PORT: 13000
      APP_BIND: 0.0.0.0
      SKILL_HUB_SANDBOX: "false"
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13000/api/app:getInfo']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s



  # ============================================================================
  # Redis 7
  # ============================================================================
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
    volumes:
      - redis-data:/data
    networks:
      - nocobase
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # PostgreSQL 16
  # ============================================================================
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: custom-postgres-pgvector:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c wal_level=logical
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${DB_USER:-nocobase}
      POSTGRES_DB: ${DB_DATABASE:-nocobase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nocobase}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nocobase
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-nocobase}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================================
  # Qdrant - Lightweight vector database for the bundled external RAG service
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - nocobase
    ports:
      - '${QDRANT_PORT:-127.0.0.1:6333}:6333'
    deploy:
      resources:
        limits:
          memory: 1G



  # ============================================================================
  # MinIO - S3 Compatible Object Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio-data:/data
    networks:
      - nocobase

  # ============================================================================
  # Carbone.io — document template render engine
  # Used by plugin-carbone-template-manager.
  # Image: https://hub.docker.com/r/carbone/carbone-ee
  # Free tier when no license is provided. NocoBase reaches it via the
  # `nocobase` network at http://carbone:4000.
  # ============================================================================
  carbone:
    image: carbone/carbone-ee:latest
    container_name: carbone
    restart: unless-stopped
    environment:
      # When this token is set, Carbone requires Bearer auth on every request.
      # Configure the same value under Plugin Settings → Carbone Template Manager.
      CARBONE_EE_STUDIO_TOKEN: ${CARBONE_EE_STUDIO_TOKEN:-carbone-secret-token}
      CARBONE_EE_AUTHENTICATION: ${CARBONE_EE_AUTHENTICATION:-false}
      CARBONE_EE_FACTORIES: ${CARBONE_EE_FACTORIES:-1}
      CARBONE_EE_PORT: '4000'
    ports:
      - '${CARBONE_PORT:-4000}:4000'
    volumes:
      - carbone-templates:/app/template
      - carbone-renders:/app/render
    networks:
      - nocobase
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4000/status']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================================================
  # browserless — Headless Chrome Server
  # Used by plugin-ai-browser (NocoBase AI Employee).
  # NocoBase controls it via Playwright CDP at ws://browser:3000
  # View live browser at http://<host>:3000/ (Debug Viewer)
  # ============================================================================
  browserless:
    image: browserless/chrome:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      # Browserless v2/current names
      - CONCURRENT=10
      - QUEUED=20
      - TIMEOUT=1800000
      - MAX_RECONNECT_TIME=1800000
      - ENABLE_DEBUGGER=true
      - LOG_LEVEL=info
      # Browserless v1/legacy names kept for compatibility with browserless/chrome tags
      - KEEP_ALIVE=true
      - CONNECTION_TIMEOUT=1800000
      - MAX_CONCURRENT_SESSIONS=10
      - DEFAULT_BLOCK_ADS=true
      - DEFAULT_STEALTH=true
    ports:
      # WebSocket CDP & Web Debug Viewer
      - '${BROWSERLESS_PORT:-3000}:3000'
    networks:
      nocobase:
        aliases:
          - browser
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          memory: 2G
