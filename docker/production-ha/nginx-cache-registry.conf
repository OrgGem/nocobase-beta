events {
    worker_connections 1024;
}
http {
    proxy_cache_path /var/cache/nginx/packages levels=1:2 keys_zone=package_cache:10m max_size=20g inactive=30d use_temp_path=off;

    server {
        listen 80;

        # --- NPM Cache ---
        location /npm/ {
            proxy_pass https://registry.npmjs.org/;
            proxy_cache package_cache;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_set_header Host registry.npmjs.org;
            proxy_ssl_server_name on;
            proxy_ssl_name registry.npmjs.org;
        }

        # --- APT Debian Cache ---
        location /debian/ {
            proxy_pass http://deb.debian.org/debian/;
            proxy_cache package_cache;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_set_header Host deb.debian.org;
        }

        # --- APT Ubuntu Cache ---
        location /ubuntu/ {
            proxy_pass http://archive.ubuntu.com/ubuntu/;
            proxy_cache package_cache;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_set_header Host archive.ubuntu.com;
        }

        # --- PyPI Cache ---
        location /pypi-simple/ {
            proxy_pass https://pypi.org/simple/;
            proxy_cache package_cache;
            proxy_cache_valid 200 302 1d;
            proxy_cache_valid 404 1m;
            proxy_set_header Host pypi.org;
            proxy_ssl_server_name on;
            proxy_ssl_name pypi.org;
            proxy_set_header Accept-Encoding ""; # Force uncompressed HTML to allow sub_filter
            # Modify PyPI HTML to point to our proxy for file downloads
            sub_filter 'https://files.pythonhosted.org' 'http://$host/pypi-files';
            sub_filter_once off;
        }

        location /pypi-files/ {
            proxy_pass https://files.pythonhosted.org/;
            proxy_cache package_cache;
            proxy_cache_valid 200 302 30d; # Wheels rarely change
            proxy_set_header Host files.pythonhosted.org;
            proxy_ssl_server_name on;
            proxy_ssl_name files.pythonhosted.org;
        }
    }
}
